name: Release

# Pushing one annotated v<MAJOR>.<MINOR>.<PATCH> tag is the entire release
# procedure — see docs/how-to/release.md. The tag is the single source of truth
# for the version: no file in the repository carries a hand-maintained one.
#
# Every job reaches `preflight` through its needs: chain, so a malformed tag or
# missing one-time setup fails in seconds having built nothing, published no
# release object, and left the tap untouched.

on:
  push:
    tags:
      - 'v*'

# Read at file scope, write only where a job actually publishes. actions/checkout
# persists GITHUB_TOKEN into .git/config by default, and `test` and `build` run
# third-party build tooling — so a file-scope write token is handed to exactly
# the jobs with the least business holding one.
permissions:
  contents: read

# Two tags pushed close together would otherwise produce two `homebrew` jobs
# racing the same tap clone-and-push, and the loser fails on a non-fast-forward.
# Keyed on the ref rather than a constant so distinct tags still run in
# parallel; cancel-in-progress is off because a half-finished release is worse
# than a slow one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Derive and validate version from tag
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not name a release version — expected v<MAJOR>.<MINOR>.<PATCH> with three numeric components (see docs/how-to/release.md)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing site-checker $VERSION (tag $GITHUB_REF_NAME)"

      # FR-007 and docs/how-to/release.md both require an *annotated* tag, and
      # until now nothing checked: a lightweight tag released identically. The
      # API answers this without a checkout — an annotated tag's ref points at a
      # `tag` object, a lightweight one points straight at the `commit`.
      - name: The tag is annotated
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          kind=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.type')
          if [ "$kind" != "tag" ]; then
            echo "::error::$GITHUB_REF_NAME is a lightweight tag; releases are cut from annotated tags — re-tag with 'git tag -a' (see docs/how-to/release.md)"
            exit 1
          fi
          echo "OK   $GITHUB_REF_NAME is annotated"

      # Presence, never validity. A revoked or mis-scoped token passes here and
      # fails later, at the tap push. docs/how-to/release.md states that limit.
      # The accumulate-every-gap shape is kept even though one secret is left:
      # it is what makes a first-time setup a single run rather than one attempt
      # per missing piece, and the list grew before. No value is ever echoed.
      - name: Check one-time setup
        shell: bash
        env:
          TAP_PUSH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
        run: |
          missing=0
          for name in TAP_PUSH_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::one-time setup missing: $name (see docs/how-to/release.md)"
              missing=1
            else
              echo "OK   $name is set"
            fi
          done
          exit $missing

  # A tag can be pushed at a commit ci.yml never evaluated, so the release path
  # runs the same four gates itself rather than assuming them.
  test:
    needs: preflight
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm build
        run: pnpm build

      - name: pnpm test
        run: pnpm test

      - name: cargo test
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: cargo clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml -- -D warnings

  # needs preflight directly as well as transitively: the needs context only
  # carries direct dependencies, so `needs.preflight.outputs.version` below
  # would be empty under `needs: test` alone.
  build:
    needs: [preflight, test]
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, x86_64]
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      TARGET: ${{ matrix.arch }}-apple-darwin
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.arch }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # The committed value is the inert 0.0.0 sentinel; the tag supplies the
      # real one. tauri.conf.json has no "version" key, so Cargo.toml is what
      # the bundle reports. This desynchronises Cargo.lock, which is why no
      # step in this job may use --locked. The change is never committed.
      - name: Stamp version from tag
        run: |
          sed -i '' "s/^version = \"0.0.0\"/version = \"${VERSION}\"/" src-tauri/Cargo.toml
          grep -q "^version = \"${VERSION}\"" src-tauri/Cargo.toml || {
            echo "::error::failed to stamp version ${VERSION} into src-tauri/Cargo.toml — the 0.0.0 sentinel was not found"
            exit 1
          }

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # --bundles app is mandatory: the dmg target runs bundle_dmg.sh, which
      # calls osascript against the Finder and blocks forever with no
      # interactive session. tauri.conf.json's default targets are reduced to
      # ["app"] as well, so a forgotten flag cannot reintroduce the hang.
      #
      # No signing environment: this project has no Apple Developer Program
      # membership, deliberately (research R2). Tauri therefore does not sign
      # the bundle at all, which is what the next step exists to fix.
      - name: Build
        run: pnpm tauri build --bundles app --target "$TARGET"

      # Without an identity Tauri leaves the bundle unsealed: the Rust linker
      # ad-hoc-signs the inner executable for the *host* architecture only, and
      # there is no CodeResources seal, so `codesign -v` fails outright with
      # "code has no resources but signature indicates they must be present"
      # (measured). Two consequences, both handled here:
      #
      #  1. The cross-built x86_64 bundle gets no signature whatsoever from the
      #     linker, because macos-latest runners are arm64. This step is what
      #     makes the Intel artifact runnable at all.
      #  2. verify-install-channels.yml checks `codesign --verify` in place of
      #     the `spctl -a -t exec` it cannot pass. That check is only meaningful
      #     because something deliberately sealed the bundle first.
      #
      # No --deep: it is deprecated, and this bundle has no nested code — the
      # tree is Contents/{Info.plist, MacOS/<exe>, Resources/icon.icns}, so
      # signing the outer bundle seals all of it. --timestamp=none because an
      # ad-hoc signature cannot carry a secure timestamp, and without the flag
      # codesign may reach for Apple's timestamp server and stall.
      - name: Ad-hoc sign the app bundle
        run: |
          APP="src-tauri/target/${TARGET}/release/bundle/macos/Site Checker.app"
          codesign --force --sign - --timestamp=none "$APP"
          codesign --verify --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep -q '^Signature=adhoc' || {
            echo "::error::expected an ad-hoc signature on $APP after signing"
            exit 1
          }

      # ditto rather than tar: it preserves the modes and directory structure
      # the signature seals. There is no notarization ticket to staple.
      - name: Package
        run: |
          APP="src-tauri/target/${TARGET}/release/bundle/macos/Site Checker.app"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "site-checker-${TARGET}.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: site-checker-${{ matrix.arch }}
          path: site-checker-${{ matrix.arch }}-apple-darwin.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    # The one job that publishes, and so the one job that needs write.
    permissions:
      contents: write
    steps:
      # v8 adds two inputs, and of the three that govern this step exactly one
      # changes its behavior. `merge-multiple` is unchanged from v7 and still
      # defaults to false; v8's new `skip-decompress` also defaults to false, so
      # artifacts still land unpacked at
      # artifacts/site-checker-<arch>/… and the globs below still resolve.
      # `digest-mismatch` is the one that moved: v7 logged a warning, v8 fails
      # the run. Pinned back to warn deliberately — a mismatch here means a
      # transport-layer problem with an artifact this same workflow produced
      # minutes ago, and failing mid-release leaves a tag pushed with no release
      # object, which is worse than publishing and re-running. The signal is not
      # lost; it is in the log.
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          digest-mismatch: warn

      # Updates an existing release for the tag in place rather than failing, so
      # a re-run of a partially failed release converges on one release object.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          # The action defaults this to false, which would publish a release
          # with nothing attached if artifact naming ever drifted — and the
          # failure would then surface a job later, at `gh release download`,
          # after a release object already exists. Fail where the mistake is.
          fail_on_unmatched_files: true
          files: |
            artifacts/site-checker-aarch64/site-checker-aarch64-apple-darwin.zip
            artifacts/site-checker-x86_64/site-checker-x86_64-apple-darwin.zip

  # The only writer of clintcparker/homebrew-tap. It cannot run before a release
  # exists, and it reads the assets actually attached to that release rather than
  # predicting their names — so a missing or renamed asset fails here and leaves
  # the tap untouched instead of publishing a formula that 404s.
  homebrew:
    needs: [preflight, release]
    runs-on: ubuntu-latest
    # Read is enough: `gh release download` reads this public repository, and the
    # tap push authenticates with TAP_PUSH_TOKEN rather than GITHUB_TOKEN.
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Not `assets/` — that path is tracked in this repository (the README
          # screenshot), so checkout has already created it and a bare `mkdir`
          # fails. Kept as a plain `mkdir` rather than `-p` so a future
          # collision with a tracked path fails here instead of silently
          # rendering a formula against whatever the checkout put there.
          mkdir release-assets
          for arch in aarch64 x86_64; do
            gh release download "v${VERSION}" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "site-checker-${arch}-apple-darwin.zip" \
              --dir release-assets
          done
          ls -l release-assets

      # Two guards, both hard failures of the release, catching drift in either
      # direction: a template that gained a placeholder this step does not know
      # about, and a step that stopped substituting one the template still has.
      - name: Render formula
        run: |
          template=install/homebrew/site-checker.rb
          placeholders="VERSION SHA256_ARM64 SHA256_X86_64"

          for p in $placeholders; do
            if ! grep -q "$p" "$template"; then
              echo "::error::placeholder $p missing from $template — template drifted from render step"
              exit 1
            fi
          done

          sha() { sha256sum "release-assets/site-checker-$1-apple-darwin.zip" | cut -d' ' -f1; }
          mkdir rendered
          sed \
            -e "s/SHA256_ARM64/$(sha aarch64)/g" \
            -e "s/SHA256_X86_64/$(sha x86_64)/g" \
            -e "s/VERSION/${VERSION}/g" \
            "$template" > rendered/site-checker.rb

          for p in $placeholders; do
            if grep -q "$p" rendered/site-checker.rb; then
              echo "::error::placeholder $p survived rendering — refusing to publish a broken formula"
              exit 1
            fi
          done

          # The placeholder guards above cannot see a malformed edit to the rest
          # of the template, and the tap is public: without this, a syntax error
          # reaches every user's `brew update` and the channel check downstream
          # would still pass, because it only greps for a version string.
          # `brew audit` is the fuller check and runs on the runner in
          # verify-install-channels.yml; this is the part that can gate a push.
          ruby -c rendered/site-checker.rb

          cat rendered/site-checker.rb

      - name: Commit formula to tap
        env:
          TAP_PUSH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
        run: |
          git clone "https://x-access-token:${TAP_PUSH_TOKEN}@github.com/clintcparker/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp rendered/site-checker.rb tap/Formula/site-checker.rb
          cd tap
          if [ -z "$(git status --porcelain)" ]; then
            echo "Formula unchanged — skipping commit (idempotent re-run)"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/site-checker.rb
          git commit -m "site-checker ${VERSION}"
          git push origin HEAD
