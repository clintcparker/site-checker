name: Release

# Pushing one annotated v<MAJOR>.<MINOR>.<PATCH> tag is the entire release
# procedure — see docs/how-to/release.md. The tag is the single source of truth
# for the version: no file in the repository carries a hand-maintained one.
#
# Every job reaches `preflight` through its needs: chain, so a malformed tag or
# missing one-time setup fails in seconds having built nothing, published no
# release object, and left the tap untouched.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Derive and validate version from tag
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not name a release version — expected v<MAJOR>.<MINOR>.<PATCH> with three numeric components (see docs/how-to/release.md)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing site-checker $VERSION (tag $GITHUB_REF_NAME)"

      # Presence, never validity. An expired certificate, a revoked API key, or a
      # mis-scoped token passes here and fails later — at signing, at notarytool
      # submit, or at the tap push. docs/how-to/release.md states that limit.
      # Every gap is accumulated so a first-time setup is told all of them in one
      # run rather than one per attempt. No secret's value is ever echoed.
      - name: Check one-time setup
        shell: bash
        env:
          TAP_PUSH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          missing=0
          for name in TAP_PUSH_TOKEN \
                      APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_API_ISSUER APPLE_API_KEY_ID APPLE_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::one-time setup missing: $name (see docs/how-to/release.md)"
              missing=1
            else
              echo "OK   $name is set"
            fi
          done
          exit $missing

  # A tag can be pushed at a commit ci.yml never evaluated, so the release path
  # runs the same four gates itself rather than assuming them.
  test:
    needs: preflight
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm build
        run: pnpm build

      - name: pnpm test
        run: pnpm test

      - name: cargo test
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: cargo clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml -- -D warnings

  # needs preflight directly as well as transitively: the needs context only
  # carries direct dependencies, so `needs.preflight.outputs.version` below
  # would be empty under `needs: test` alone.
  build:
    needs: [preflight, test]
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, x86_64]
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      TARGET: ${{ matrix.arch }}-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.arch }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The committed value is the inert 0.0.0 sentinel; the tag supplies the
      # real one. tauri.conf.json has no "version" key, so Cargo.toml is what
      # the bundle reports. This desynchronises Cargo.lock, which is why no
      # step in this job may use --locked. The change is never committed.
      - name: Stamp version from tag
        run: |
          sed -i '' "s/^version = \"0.0.0\"/version = \"${VERSION}\"/" src-tauri/Cargo.toml
          grep -q "^version = \"${VERSION}\"" src-tauri/Cargo.toml || {
            echo "::error::failed to stamp version ${VERSION} into src-tauri/Cargo.toml — the 0.0.0 sentinel was not found"
            exit 1
          }

      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain
          rm -f "$RUNNER_TEMP/certificate.p12"

      - name: Write App Store Connect API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/private_keys/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/private_keys/AuthKey.p8"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # --bundles app is mandatory: the dmg target runs bundle_dmg.sh, which
      # calls osascript against the Finder and blocks forever with no
      # interactive session. tauri.conf.json's default targets are reduced to
      # ["app"] as well, so a forgotten flag cannot reintroduce the hang.
      #
      # With these variables present Tauri signs with the hardened runtime,
      # submits to notarytool, waits, and staples — no separate invocation.
      # Note the deliberate name shift: Tauri's APPLE_API_KEY is the *Key ID*,
      # while the repository secret of that name holds the base64 .p8 (written
      # to APPLE_API_KEY_PATH above).
      - name: Build, sign, notarize and staple
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/private_keys/AuthKey.p8
        run: pnpm tauri build --bundles app --target "$TARGET"

      # Staple before zipping — a ticket stapled to a zip does not survive
      # extraction. ditto preserves the extended attributes and resource forks
      # that keep the signature valid; tar would not.
      - name: Package
        run: |
          APP="src-tauri/target/${TARGET}/release/bundle/macos/Site Checker.app"
          xcrun stapler validate "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "site-checker-${TARGET}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: site-checker-${{ matrix.arch }}
          path: site-checker-${{ matrix.arch }}-apple-darwin.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Updates an existing release for the tag in place rather than failing, so
      # a re-run of a partially failed release converges on one release object.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/site-checker-aarch64/site-checker-aarch64-apple-darwin.zip
            artifacts/site-checker-x86_64/site-checker-x86_64-apple-darwin.zip

  # The only writer of clintcparker/homebrew-tap. It cannot run before a release
  # exists, and it reads the assets actually attached to that release rather than
  # predicting their names — so a missing or renamed asset fails here and leaves
  # the tap untouched instead of publishing a cask that 404s.
  homebrew:
    needs: [preflight, release]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir assets
          for arch in aarch64 x86_64; do
            gh release download "v${VERSION}" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "site-checker-${arch}-apple-darwin.zip" \
              --dir assets
          done
          ls -l assets

      # Two guards, both hard failures of the release, catching drift in either
      # direction: a template that gained a placeholder this step does not know
      # about, and a step that stopped substituting one the template still has.
      - name: Render cask
        run: |
          template=install/homebrew/site-checker.rb
          placeholders="VERSION SHA256_ARM64 SHA256_X86_64"

          for p in $placeholders; do
            if ! grep -q "$p" "$template"; then
              echo "::error::placeholder $p missing from $template — template drifted from render step"
              exit 1
            fi
          done

          sha() { sha256sum "assets/site-checker-$1-apple-darwin.zip" | cut -d' ' -f1; }
          mkdir rendered
          sed \
            -e "s/SHA256_ARM64/$(sha aarch64)/g" \
            -e "s/SHA256_X86_64/$(sha x86_64)/g" \
            -e "s/VERSION/${VERSION}/g" \
            "$template" > rendered/site-checker.rb

          for p in $placeholders; do
            if grep -q "$p" rendered/site-checker.rb; then
              echo "::error::placeholder $p survived rendering — refusing to publish a broken cask"
              exit 1
            fi
          done
          cat rendered/site-checker.rb

      - name: Commit cask to tap
        env:
          TAP_PUSH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
        run: |
          git clone "https://x-access-token:${TAP_PUSH_TOKEN}@github.com/clintcparker/homebrew-tap.git" tap
          mkdir -p tap/Casks
          cp rendered/site-checker.rb tap/Casks/site-checker.rb
          cd tap
          if [ -z "$(git status --porcelain)" ]; then
            echo "Cask unchanged — skipping commit (idempotent re-run)"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/site-checker.rb
          git commit -m "site-checker ${VERSION}"
          git push origin HEAD
