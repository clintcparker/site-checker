name: CI

# The four gates the constitution names by hand, run on every push to main and
# every pull request, so "green before merge" stops depending on run discipline.
#
# Deliberately separate from release.yml and verify-install-channels.yml: a red
# check here means the code is broken, which is a different question from a red
# release or a broken install channel.
#
# Action pins track the Node runtime, not the newest major. The governing rule
# is the lowest major that runs on node24, because a stale runtime does not
# fail — it emits a deprecation annotation on a green run and keeps working
# until GitHub stops force-upgrading it — and jumping past the minimum only
# absorbs behavior changes this repo has no reason to take on.
#
# The pins in this file and in release.yml no longer all match that rule, and
# the divergence is recorded rather than hidden. The node24 bump shipped as
# PR #27 at checkout@v5 / setup-node@v6 / action-setup@v6 / upload-artifact@v6 /
# download-artifact@v7 / gh-release@v3. PR #28, a Dependabot group bump opened
# 64 seconds after that merge and merged three minutes after it opened, moved
# four of those to checkout@v7, setup-node@v7, upload-artifact@v7, and
# download-artifact@v8. That PR should not have been
# proposed — dependabot.yml lists exactly those majors as declined — and it was
# only proposed because the ignore syntax was inert; see the comment in that
# file. The bump was kept rather than reverted, so what follows is the
# evaluation that should have preceded it:
#
#   checkout v6/v7 — v6 changes credential persistence, v7 blocks fork-PR
#     checkout for pull_request_target and workflow_run and moves to ESM. No
#     workflow here uses either trigger, and release.yml's homebrew job pushes
#     with TAP_PUSH_TOKEN rather than a persisted checkout credential.
#   setup-node v7 — inherits v6's narrowing of automatic caching to npm only.
#     All three call sites pass `cache: pnpm` explicitly, so it is never
#     consulted, exactly as it was not at v6.
#   upload-artifact v7 — adds opt-in direct (unzipped) upload; `archive`
#     defaults to true, so the zip container is unchanged.
#   download-artifact v8 — the only one with a real effect. See release.yml.
#
# pnpm/action-setup stays at v6, one major above its node24 minimum: v6 only
# adds pnpm 11 support and still self-updates to the `packageManager` version
# package.json pins, so it costs nothing and shortens the next bump.
#
# The floor all of this implies is Actions runner >= 2.327.1, which every
# GitHub-hosted runner is well past; a self-hosted runner would have to be
# checked. .github/dependabot.yml is what surfaces the next such deprecation as
# a PR rather than as an annotation nobody reads.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # macOS is required, not preferred: src-tauri links macOS system frameworks
  # through tauri 2.11. Building it on Ubuntu would need the WebKitGTK dev
  # packages and would then be testing a configuration nobody ships.
  #
  # Nothing here runs the bundler, so no step can block on Finder automation.
  # No frontend build either — cargo test does not need ../dist to exist.
  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # --locked here, never in release.yml: this job does not stamp the
      # version, so the committed Cargo.lock must match and dependency drift
      # should fail rather than resolve silently.
      - name: cargo test
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: cargo clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml -- -D warnings

      # What turns "the tag is the single source of truth" from a convention
      # into a guarantee. Without it, a hand-edited version silently competes
      # with the tag and nothing notices until an install reports the wrong one.
      - name: Version sentinel
        run: |
          fail=0
          if ! grep -q '^version = "0.0.0"' src-tauri/Cargo.toml; then
            echo "::error::src-tauri/Cargo.toml version must stay 0.0.0 — the release tag is the source of truth (see docs/how-to/release.md)"
            fail=1
          fi
          if ! grep -q '"version": "0.0.0"' package.json; then
            echo "::error::package.json version must stay 0.0.0 — the release tag is the source of truth (see docs/how-to/release.md)"
            fail=1
          fi
          if grep -q '"version"' src-tauri/tauri.conf.json; then
            echo "::error::src-tauri/tauri.conf.json must not carry a version key — Tauri falls back to Cargo.toml, which release.yml stamps from the tag"
            fail=1
          fi
          [ "$fail" -eq 0 ] && echo "OK   one version source, and it is an inert sentinel"
          exit $fail

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm test
        run: pnpm test

      - name: pnpm build
        run: pnpm build
