version: 2

# Only the github-actions ecosystem, deliberately. A JS action pinned to a
# stale major keeps working right up until GitHub retires the Node runtime
# under it, and the only warning is a deprecation annotation on a run that
# still passes — which is exactly how the Node 20 warning sat unnoticed until
# a human happened to read the log. A weekly PR turns that silent decay into
# something with a review surface.
#
# Not covered here: cargo and npm. Not because CI would catch their drift — it
# would not. `cargo test --locked` and `pnpm install --frozen-lockfile` fail
# when a lockfile disagrees with its own manifest; neither notices that an
# upstream crate or package has published a newer version, and neither reports
# a security advisory. They are excluded because this is a single-user desktop
# app where routine dependency churn is not worth the PR volume, and the pinned
# set staying reproducible is the property that actually matters. Turning on
# security-only updates for those two ecosystems is a separate decision, worth
# making explicitly rather than inheriting from this file.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"

    # One PR per week for everything, rather than one per action. Ungrouped,
    # eight actions compete for Dependabot's default open-pull-requests-limit
    # of 5, which stops opening PRs silently once hit — the same "a signal
    # nobody sees" failure this file exists to fix. The limit is set explicitly
    # below so the number is a choice rather than a default.
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5

    # Majors this repo evaluated and declined. Each was read at its own
    # action.yml before being skipped.
    #
    # Read this first: as of 2026-08-12 every entry below is INERT, and not
    # because of a syntax problem. PR #28 moved the tree onto checkout@v7,
    # setup-node@v7, upload-artifact@v7, and download-artifact@v8 — which are,
    # respectively, the newest major each of those actions has published. The
    # entries name versions the repo already runs, and Dependabot only proposes
    # upgrades, so there is nothing left for them to decline. Do not read this
    # block as live protection for the current pins; it is not.
    #
    # It is kept for two reasons. First, it is the record of which majors were
    # evaluated and rejected, and why. Second, it is load-bearing the moment
    # anyone pins one of these back down: revert download-artifact to v7 without
    # this entry and Dependabot re-proposes v8 within the week, exactly as it
    # did the first time. The entries go live again the instant a pin drops
    # below them.
    #
    # Each entry names the declined major *by version*, deliberately, and not
    # `update-types: ["version-update:semver-major"]`. These actions are
    # referenced by a bare major tag (`@v5`, `@v6`, `@v7`), and a major bump is
    # the only version update Dependabot can propose for a reference of that
    # shape — a "Bump actions/checkout from 5 to 6" PR and nothing else. So
    # ignoring the major *line* would not narrow these actions, it would silence
    # them permanently, and the next runtime deprecation would ride in on a
    # major this file had pre-emptively agreed never to mention. That is the
    # exact annotation-nobody-reads failure this file exists to prevent.
    #
    # Consequence of the narrow form: when the major above a declined one ships
    # (checkout v8, download-artifact v9, …), Dependabot proposes it and the
    # decision gets made again on current information. That is intended. Adding
    # a new version to a list here is the deliberate act; inheriting a blanket
    # skip is not.
    #
    # The values are bare integers, and that detail is load-bearing. This file
    # first shipped them as `8.x`/`7.x`, the npm and NuGet wildcard spelling,
    # which does not work here: the github-actions ecosystem parses `versions:`
    # as a Gem requirement, RubyGems accepts `8.x` as a legal *version* (it
    # permits alphabetic segments, as in `1.0.beta`), and so `8.x` compiles to
    # the equality `= 8.x` — a match against a version that will never exist.
    # It raises no error. It simply matches nothing. Every entry below was inert
    # on the first attempt, and Dependabot opened a PR bumping all four to the
    # exact versions named here 64 seconds after the file landed on main
    # (PR #28). A bare `8` is an exact match on the bare major tag Dependabot
    # reports, and is the form that works. `>= 8` also parses, but it declines
    # every future major forever, which is the permanent-silence failure above.
    #
    # A `versions:` list is OR'd across its elements, so checkout's ["6", "7"]
    # declines both. That is the documented meaning of a list and matches the
    # ecosystem examples in GitHub's options reference, but it has not been
    # observed here — the first form never matched anything, so PR #28 proves
    # nothing about how a list is combined.
    #
    # There is no local check for any of this — `actionlint` does not read this
    # file and no schema catches a semantically empty ignore. The observable
    # signal is on Dependabot's side and it is unambiguous: if a PR ever
    # proposes a version that appears in a list below, the ignore is broken.
    # Note that today's inertness means the corrected syntax cannot be observed
    # working either; that check waits for the first pin that drops below an
    # entry here.
    ignore:
      # v8 defaults digest-mismatch to `error`, turning what is a logged
      # warning today into a failed release run, and it skips decompression for
      # non-zip content. v7 was the evaluated pin; see release.yml for why v8
      # is nonetheless in the tree and pinned back to warn-on-mismatch.
      - dependency-name: "actions/download-artifact"
        versions: ["8"]
      # v7 adds opt-in direct (unzipped) upload; v6 is the first default-node24
      # major and is all this repo needs.
      - dependency-name: "actions/upload-artifact"
        versions: ["7"]
      # v6 changes credential persistence and v7 adds a fork-PR checkout block
      # plus an ESM migration. v5 is already node24.
      - dependency-name: "actions/checkout"
        versions: ["6", "7"]
      # v6 is already node24 and its npm-only caching narrowing is a no-op here
      # (every call site passes `cache: pnpm`). v7 is newer than anything this
      # repo has a reason to absorb.
      - dependency-name: "actions/setup-node"
        versions: ["7"]
