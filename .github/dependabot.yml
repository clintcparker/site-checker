version: 2

# Only the github-actions ecosystem, deliberately. A JS action pinned to a
# stale major keeps working right up until GitHub retires the Node runtime
# under it, and the only warning is a deprecation annotation on a run that
# still passes — which is exactly how the Node 20 warning sat unnoticed until
# a human happened to read the log. A weekly PR turns that silent decay into
# something with a review surface.
#
# Not covered here: cargo and npm. Not because CI would catch their drift — it
# would not. `cargo test --locked` and `pnpm install --frozen-lockfile` fail
# when a lockfile disagrees with its own manifest; neither notices that an
# upstream crate or package has published a newer version, and neither reports
# a security advisory. They are excluded because this is a single-user desktop
# app where routine dependency churn is not worth the PR volume, and the pinned
# set staying reproducible is the property that actually matters. Turning on
# security-only updates for those two ecosystems is a separate decision, worth
# making explicitly rather than inheriting from this file.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"

    # One PR per week for everything, rather than one per action. Ungrouped,
    # eight actions compete for Dependabot's default open-pull-requests-limit
    # of 5, which stops opening PRs silently once hit — the same "a signal
    # nobody sees" failure this file exists to fix. The limit is set explicitly
    # below so the number is a choice rather than a default.
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5

    # Majors this repo evaluated and declined. Each was read at its own
    # action.yml before being skipped, and each is already on a node24 major —
    # so ignoring these costs nothing in runtime currency, which is the only
    # thing this file exists to track. Ignoring the major *line* rather than a
    # version, so a later v8/v9 does not reopen a settled question. Revisiting
    # one means deleting its entry deliberately, not re-litigating a PR.
    ignore:
      # v8 defaults digest-mismatch to `error`, turning what is a logged
      # warning today into a failed release run.
      - dependency-name: "actions/download-artifact"
        update-types: ["version-update:semver-major"]
      # v7 changes upload behavior; v6 is the first default-node24 major and
      # is all this repo needs.
      - dependency-name: "actions/upload-artifact"
        update-types: ["version-update:semver-major"]
      # v6 changes credential persistence and v7 adds a fork-PR checkout block.
      # v5 is already node24.
      - dependency-name: "actions/checkout"
        update-types: ["version-update:semver-major"]
      # v6 is already node24 and its npm-only caching narrowing is a no-op
      # here. v7 is newer than anything this repo has a reason to absorb.
      - dependency-name: "actions/setup-node"
        update-types: ["version-update:semver-major"]
