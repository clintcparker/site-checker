        If nothing is reported, there is nothing to do.

        If a rule IS reported, do NOT reach for `git add -f`. That stages the files once
        and leaves the next step, the next run and the reviewer's checkout with the same
        conflict — and a pull request that links a path git still considers ignored is a
        404 waiting to happen. Un-ignore the path once, in a committed file: append
        `!<subdir>/` to `<feature_dir>/.gitignore`, creating that file if it does not
