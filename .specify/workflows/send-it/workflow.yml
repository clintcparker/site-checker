        exist. A `.gitignore` inside the feature directory outranks the root one, so a
        single line fixes the path for this step and every step after it, and a plain
        `git -C <tree> add` works from then on. If `feature_dir` ITSELF is reported as
        ignored its own `.gitignore` is never read — append the negation for it to the
        repo-root `.gitignore` first. Do nothing when the negation is already present,
        and never `git add -f` in this workflow.

        ARTIFACT COMMIT — after the capture pass, commit any new or modified files to the
        feature branch. Run `git -C <tree> add .` and
        `git -C <tree> commit` with a descriptive Conventional Commit message
        (e.g. `docs(screenshots): add before screenshots for <feature-name>`). Skip
        silently if there is nothing to commit. Do not prompt — treat the optional git
        auto-commit hook as answered YES.

        UNATTENDED RUN — no user is present. Make every judgement call
        (UI-relevance, which targets, what seed data) yourself and record it in
        the manifest instead of asking. If the app profile is still
        unconfigured, derive it and write it back rather than stopping. A
        failure to build or start the app here means the *base* branch is
        broken: report it and continue the workflow without baseline
        screenshots rather than aborting.

  - id: implement
    command: speckit.implement
    integration: "{{ inputs.integration }}"
    input:
      args: >-
        {{ inputs.spec }}

        --- RUN CONTROL (not part of the feature description above) ---

        FEATURE IDENTITY — resolve it from the run context, not from the repo. The worktree
        step pinned this run's feature to `.specify/run-context.json`; look for it under
        $SPECIFY_INIT_DIR first, then in the current directory, then in the primary
        checkout. Take `branch`, `feature_dir` and `worktree_path` from it, and export
        SPECIFY_INIT_DIR=<worktree_path> (when non-empty) and
        SPECIFY_FEATURE_DIRECTORY=<feature_dir> for every `.specify/scripts/**` invocation
        this step makes.

        Every file this step writes belongs in the tree named by `worktree_path`. Never
        infer the feature from the current branch, from `.specify/feature.json`, or from the
        newest directory under `specs/`; right after a merge all three name the PREVIOUS
        feature, and implementing against those is how a run edits the wrong tree.

        If a script resolves a feature the run context does not name, it has found the wrong
        one: FAIL THIS STEP LOUDLY, naming both the resolved feature and the pinned one, and
        do not adopt it. If no run context file can be found at all, fail the same way
        rather than guessing.

        WORKTREE DISCIPLINE — the two SPECIFY_* overrides are read only by
        `.specify/scripts/**`. Every other command this step runs — `git`, `gh`, the
        build, the test suite, any file write — resolves against the current working
        directory, and in an unattended run that is the PRIMARY checkout, not this run's
        tree. Direct each of them at the tree explicitly: `git -C <tree> …`, or `cd
        <tree>` first. A bare `git add`, `git commit`, `git push` or test command writes
        to whatever branch the primary happens to be standing on.

        <tree> is `worktree_path` from the run context when that field is non-empty, and
        `primary_path` when it is empty — an empty `worktree_path` means the run has no
        worktree (worktree_isolation=failed) and the primary IS this run's tree. Before
        the first write, confirm both: `git -C <tree> rev-parse --show-toplevel` names
        <tree>, and `git -C <tree> branch --show-current` names the run context's
        `branch`. If either disagrees, FAIL THIS STEP LOUDLY rather than write.

        ALL WRITES HAPPEN IN THIS RUN'S WORKTREE ON THIS RUN'S BRANCH. Finding yourself
        about to write in the primary checkout — a commit onto the target branch, an edit
        under `primary_path`, a branch cut from the primary's HEAD — is a FAILED STEP,
        not a workaround. Stop and report it; do not commit there anyway, and do not move
        the primary to make it fit.

        PRIOR WORK — if `worktree_path` already contains uncommitted or committed changes
        from a prior run, adopt them: rebase onto the current base ref if needed, extend or
        complete the implementation rather than rewriting it, and extend the tests rather
        than replacing them. Record what was inherited and what was added. Do not ask.

        ARTIFACT VISIBILITY — the artifacts this step writes under `feature_dir` are
        evidence the pull request links to, so they have to be TRACKED, not force-added.
        Before committing, ask git whether they are: `git -C <tree> check-ignore -v --
        <feature_dir>/` and the same for each subdirectory this step wrote under it. The
        path need not exist yet — `check-ignore` matches pathnames, not files — and exit
        status 1 with no output means NOT ignored, which is the good case, not a failure.
        If nothing is reported, there is nothing to do.

        If a rule IS reported, do NOT reach for `git add -f`. That stages the files once
        and leaves the next step, the next run and the reviewer's checkout with the same
        conflict — and a pull request that links a path git still considers ignored is a
        404 waiting to happen. Un-ignore the path once, in a committed file: append
        `!<subdir>/` to `<feature_dir>/.gitignore`, creating that file if it does not
        exist. A `.gitignore` inside the feature directory outranks the root one, so a
        single line fixes the path for this step and every step after it, and a plain
        `git -C <tree> add` works from then on. If `feature_dir` ITSELF is reported as
        ignored its own `.gitignore` is never read — append the negation for it to the
        repo-root `.gitignore` first. Do nothing when the negation is already present,
        and never `git add -f` in this workflow.

        ARTIFACT COMMIT — after the implementation is complete, commit all changes to the
        feature branch. Run `git -C <tree> add .` and
        `git -C <tree> commit` with a descriptive Conventional Commit message
        appropriate to what was implemented (e.g. `feat: implement <feature-name>`; use
        finer-grained commits per logical unit when the changes span multiple concerns).
        Skip silently if there is nothing to commit. Do not prompt — treat the optional git
        auto-commit hook as answered YES.

        UNATTENDED RUN — no user is present; never pause for input and never ask a question.
        Make every judgment call yourself, record it and its reasoning in the artifact, and
        flag it as an open decision the ship step should surface in the PR description.

  - id: screenshots-after
    command: speckit.screenshots.capture
    integration: "{{ inputs.integration }}"
    input:
      args: >-
        mode: after. Target branch: {{ inputs.target_branch }}.

        FEATURE IDENTITY — resolve it from the run context, not from the repo, exactly as
        the before pass did: read `.specify/run-context.json` ($SPECIFY_INIT_DIR first,
        then the current directory, then the primary checkout), take `branch`,
        `feature_dir` and `worktree_path` from it, and export SPECIFY_INIT_DIR and
        SPECIFY_FEATURE_DIRECTORY from those values. The manifest to reuse is the one
        under that `feature_dir`, and the app to build and drive is the one in
        `worktree_path`. A pair of captures taken from two different features is worse
        than no pair at all, because it looks like evidence. If anything resolves a
        feature the run context does not name, or no run context can be found, FAIL THIS
        STEP LOUDLY naming what you found.

        WORKTREE DISCIPLINE — the two SPECIFY_* overrides are read only by
        `.specify/scripts/**`. Every other command this step runs — `git`, `gh`, the
        build, the test suite, any file write — resolves against the current working
