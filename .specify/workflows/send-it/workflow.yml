        answered YES.

        UNATTENDED RUN — no user is present; never pause for input and never ask a question.
        Make every judgment call yourself, record it and its reasoning in the artifact, and
        flag it as an open decision the ship step should surface in the PR description.

  # Baseline screenshots MUST run before implement: at this point the worktree
  # differs from the target branch only by spec documents, so the app still
  # renders exactly what the PR's base commit would. The command self-skips
  # (writing screenshots/SKIPPED.md) when the spec has no UI surface.
  # Provided by the `screenshots` extension.
  - id: screenshots-before
    command: speckit.screenshots.capture
    integration: "{{ inputs.integration }}"
    input:
      args: >-
        mode: before. Target branch: {{ inputs.target_branch }}.

        FEATURE IDENTITY — resolve it from the run context, not from the repo. The
        worktree step pinned this run's feature to `.specify/run-context.json`; look for
        it under $SPECIFY_INIT_DIR first, then in the current directory, then in the
        primary checkout. Take `branch`, `feature_dir` and `worktree_path` from it, and
        export SPECIFY_INIT_DIR=<worktree_path> (when non-empty) and
        SPECIFY_FEATURE_DIRECTORY=<feature_dir> for every `.specify/scripts/**`
        invocation this step makes. The manifest and the images belong under that
        `feature_dir`, and the app to build and drive is the one in `worktree_path`.

        Never infer the feature from the current branch, from `.specify/feature.json`,
        or from the newest directory under `specs/` — right after a merge all three name
        the PREVIOUS feature, and this run's session is usually standing in the primary
        checkout, where that is exactly what they name. If anything resolves a feature
        the run context does not name, FAIL THIS STEP LOUDLY naming both rather than
        capturing the wrong tree. If no run context file can be found at all, fail the
        same way rather than guessing.

