schema_version: "1.0"
workflow:
  id: "send-it"
  name: "Spec to PR, unattended"
  version: "0.9.0"
  author: "clintcparker"
  description: "worktree → specify → plan → tasks → screenshots → implement → screenshots → ship; no gates, ends in an open PR with before/after UI screenshots. Requires the `worktrees`, `screenshots` and `ship` extensions."

requires:
  # Same floor as yolo: 0.8.12 is the first release with engine-side resolution
  # of ``integration: "auto"`` (spec-kit #2421). Older versions treat "auto" as
  # a literal integration key and fail at dispatch.
  #
  # The `screenshots` extension is a hard dependency -- the two capture steps
  # fail at dispatch without it -- and as of 0.3.0 so is `worktrees`, for the
  # first step. Neither can be declared here: `requires` recognizes only
  # speckit_version and integrations, and an unknown key is a validation
  # error. See this workflow's README.
  speckit_version: ">=0.8.12"
  integrations:
    # Advisory compatibility hint, not a closed set -- see workflows/yolo.
    any:
      - "claude"

inputs:
  spec:
    type: string
    required: true
    prompt: "Describe what you want to build"
  integration:
    type: string
    default: "auto"
    prompt: "Integration to use (e.g. claude, copilot, gemini; 'auto' uses the project's initialized integration)"
  target_branch:
    type: string
    default: "main"
    prompt: "Branch the pull request should target"

steps:
  # Worktree isolation is a STEP, not an inherited hook side-effect.
  #
  # The global before_specify hook in .specify/extensions.yml only fires when a run
  # actually starts at specify. A resumed run, or a fix-up run over a feature that was
  # already specified, enters at a later step, never triggers the hook, and executes
  # entirely in the primary checkout. That is not recoverable after the fact unless the
  # primary happens to be clean: create-worktree.sh's header states the invariant — a
  # branch can live in exactly one worktree, so a `git checkout -b` in the primary
  # makes `git worktree add` impossible for that same branch until the primary moves
  # off it.
  #
  # This step is idempotent (see speckit.worktrees.create Outline step 0). When the
  # before_specify hook has already fired, it finds the session inside a worktree and
  # no-ops, so declaring both costs nothing.
  #
  # Where the later steps actually run depends on the `session` field this step reports,
  # and in an unattended run it is usually NOT the worktree. Moving the session needs the
  # EnterWorktree tool, which requires interactive approval that nobody is here to give,
  # so the normal outcome is worktree_isolation=created with session=primary: the branch
  # lives in its worktree and the session's working directory is still the primary
  # checkout. The SPECIFY_INIT_DIR / SPECIFY_FEATURE_DIRECTORY overrides this step emits
  # close only half of that gap. `.specify/scripts/**` reads them; nothing else does, so
  # every plain git, gh, build and test command a later step runs still resolves against
  # the primary unless that step directs it at the worktree by hand — which is what the
  # WORKTREE DISCIPLINE block in every step below exists to make it do (issue #5).
  # Nothing enforces either half, which is why ship surfaces session=primary in the pull
  # request description. Do not add a step that assumes the primary checkout is on the
  # feature branch either.
  - id: worktree
    command: speckit.worktrees.create
    integration: "{{ inputs.integration }}"
    input:
      args: >-
        UNATTENDED RUN — no user is present; never prompt and never ask which layout.

        ACQUIRE LOCK — after determining the branch name (Outline step 1) and before
        creating anything (step 3), generate a run_id (format: <utc-timestamp>-<branch>,
        e.g. 20260812T112100Z-005-user-auth) and call acquire-lock.sh --run-id "$RUN_ID"
        --pid "$PPID" (Outline step 2). Pass $PPID, never $$: every command here runs in a
        shell that exits as soon as it returns, so $$ names a process that is already dead
        by the next step and a lock stamped with it looks stale to every later run. $PPID
        is the agent process, which lives for the whole run.

        Exit code 3 means a live concurrent run holds the lock — either its process is
        alive or its lock is younger than lock_ttl_minutes: report the conflict naming the
        existing run_id and pid, and STOP — do not create the worktree, do not pass
        --force. Skip this step only when step 0 determined worktree_isolation=already.
        Pass $RUN_ID to write-run-context.sh via --run-id in step 5 so the lock and run
        context share the same identifier; that file is where the step which releases the
        lock at the end of this workflow reads it from.

        Ensure this session is inside a feature worktree before any later step touches
        the repo. Follow the command's Outline step 0 case detection: no-op if already
        isolated; use the existing BRANCH NAME (never --from-description) if the primary
        checkout is on a feature branch; use --from-description "{{ inputs.spec }}" only
        when the primary is on the base ref with no feature branch yet.

        If the feature branch is already checked out in the primary, take the recovery
        path only when `git status --porcelain` and `git stash list` are BOTH empty:
        move the primary to the base ref, attach the worktree, enter it, and report
        worktree_isolation=recovered naming the base ref the primary now sits on. If
        either is non-empty, do NOT force it and do NOT move the primary — report
        worktree_isolation=failed with the branch name and continue the workflow in
        place.

        EnterWorktree needs interactive approval and nobody is here to give it, so expect
        the call to be refused and expect session=primary. That is the normal outcome of
        an unattended run, not a failure — but do NOT let the spec land in the primary
        checkout because of it. Emit SPECIFY_INIT_DIR and SPECIFY_FEATURE_DIRECTORY in the
        fields block exactly as Outline step 4 requires, and export SPECIFY_INIT_DIR for
        every .specify/scripts/** invocation from here to the end of the run.

        REPORT, DO NOT REMEDY. Creating the branch inside its worktree is this step's whole
        mandate. If the resolved base ref lags a local branch of the same name, or the spec
        description names gitignored or untracked paths that cannot exist in a fresh
        worktree, NAME them and move on: no merge, rebase, cherry-pick, reset or pull to
        close the gap, and no copying untracked files across. "Never prompt" is not licence
        to act unilaterally.

        WORKTREE DISCIPLINE — the overrides are not isolation, and the report must say
        so. SPECIFY_INIT_DIR and SPECIFY_FEATURE_DIRECTORY are honored only by
        `.specify/scripts/**`; with session=primary every plain `git`, `gh`, build and
        test command a later step runs still resolves against the primary checkout unless
        that step directs it at the worktree (`git -C <path>`, or `cd <path>` first).
        Report the worktree path in the fields block as `worktree_path=<path>` alongside
        the two overrides, and state the invariant every later step inherits: all writes
        happen in this run's worktree on this run's branch, and a step about to write in
        the primary checkout has failed rather than found a workaround.

        PIN THE FEATURE — take Outline step 5 on every path out of this command, including
        worktree_isolation=failed: write the run context with write-run-context.sh
        --run-id "$RUN_ID" and report run_context=<path> in the fields block. Every later
        step of this workflow resolves FEATURE_DIR from that file and has nothing else to
        go on. If the script exits 3, another unattended run owns the pointer in this
        primary checkout — report run_context=collision naming both branches, and do NOT
        pass --force.

        Carry worktree_isolation, session AND run_context forward, so the ship step can
        surface a recovered, failed, degraded, or collided outcome in the pull request
        description.

  # Every step below re-states the same FEATURE IDENTITY block. That is not an oversight:
  # the workflow engine has no step-output templating, so a step receives nothing but its
  # own args — not the worktree step's report, not the previous step's output. Each one has
  # to be told, in its own args, where to find the run context. See issue #1.
  - id: specify
    command: speckit.specify
    integration: "{{ inputs.integration }}"
    input:
      args: >-
        {{ inputs.spec }}

        --- RUN CONTROL (not part of the feature description above) ---

        FEATURE IDENTITY — resolve it from the run context, not from the repo. The worktree
        step pinned this run's feature to `.specify/run-context.json`; look for it under
        $SPECIFY_INIT_DIR first, then in the current directory, then in the primary
        checkout. Take `branch`, `feature_dir` and `worktree_path` from it, and export
        SPECIFY_INIT_DIR=<worktree_path> (when non-empty) and
        SPECIFY_FEATURE_DIRECTORY=<feature_dir> for every `.specify/scripts/**` invocation
        this step makes.

        WORKTREE DISCIPLINE — the two SPECIFY_* overrides are read only by
        `.specify/scripts/**`. Every other command this step runs — `git`, `gh`, the
        build, the test suite, any file write — resolves against the current working
        directory, and in an unattended run that is the PRIMARY checkout, not this run's
        tree. Direct each of them at the tree explicitly: `git -C <tree> …`, or `cd
        <tree>` first. A bare `git add`, `git commit`, `git push` or test command writes
        to whatever branch the primary happens to be standing on.

        <tree> is `worktree_path` from the run context when that field is non-empty, and
        `primary_path` when it is empty — an empty `worktree_path` means the run has no
        worktree (worktree_isolation=failed) and the primary IS this run's tree. Before
        the first write, confirm both: `git -C <tree> rev-parse --show-toplevel` names
        <tree>, and `git -C <tree> branch --show-current` names the run context's
        `branch`. If either disagrees, FAIL THIS STEP LOUDLY rather than write.

        ALL WRITES HAPPEN IN THIS RUN'S WORKTREE ON THIS RUN'S BRANCH. Finding yourself
        about to write in the primary checkout — a commit onto the target branch, an edit
        under `primary_path`, a branch cut from the primary's HEAD — is a FAILED STEP,
        not a workaround. Stop and report it; do not commit there anyway, and do not move
        the primary to make it fit.

        PRIOR WORK — before running the spec command, check whether `feature_dir` already
        exists and contains a spec document. If it does, this is a resumed run: adopt the
        existing spec without regenerating it, note the adoption in the step output, and
        continue. Do not mint a second branch and do not ask. If the existing spec is
        incomplete, extend it in place and record what was added. Only run the full spec
        command when `feature_dir` does not yet exist or is empty.

        Do not mint a new feature number and do not derive one from `specs/`: the branch in
        the run context is this run's feature, whatever the tree the session is standing in
        looks like.

        If a script resolves a feature the run context does not name, it has found the wrong
        one: FAIL THIS STEP LOUDLY, naming both, and do not adopt it. If no run context file
        can be found at all, fail the same way rather than guessing.

        ARTIFACT VISIBILITY — the artifacts this step writes under `feature_dir` are
        evidence the pull request links to, so they have to be TRACKED, not force-added.
        Before committing, ask git whether they are: `git -C <tree> check-ignore -v --
        <feature_dir>/` and the same for each subdirectory this step wrote under it. The
        path need not exist yet — `check-ignore` matches pathnames, not files — and exit
        status 1 with no output means NOT ignored, which is the good case, not a failure.
        If nothing is reported, there is nothing to do.

        If a rule IS reported, do NOT reach for `git add -f`. That stages the files once
        and leaves the next step, the next run and the reviewer's checkout with the same
        conflict — and a pull request that links a path git still considers ignored is a
        404 waiting to happen. Un-ignore the path once, in a committed file: append
        `!<subdir>/` to `<feature_dir>/.gitignore`, creating that file if it does not
        exist. A `.gitignore` inside the feature directory outranks the root one, so a
        single line fixes the path for this step and every step after it, and a plain
        `git -C <tree> add` works from then on. If `feature_dir` ITSELF is reported as
        ignored its own `.gitignore` is never read — append the negation for it to the
        repo-root `.gitignore` first. Do nothing when the negation is already present,
        and never `git add -f` in this workflow.

        ARTIFACT COMMIT — after completing this step's work, commit any new or modified files
        to the feature branch. Run `git -C <tree> add .` and
        `git -C <tree> commit` with a descriptive Conventional Commit message
        (e.g. `docs(specify): add specification for <feature-name>`). Skip silently if there
        is nothing to commit. Do not prompt — treat the optional git auto-commit hook as
        answered YES.

        UNATTENDED RUN — no user is present; never pause for input and never ask a question.
        Make every judgment call yourself, record it and its reasoning in the artifact, and
        flag it as an open decision the ship step should surface in the PR description.

