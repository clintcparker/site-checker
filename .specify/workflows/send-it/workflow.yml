        failure into the manifest notes, and let the workflow continue so ship
        can surface it in the pull request instead of silently dropping it.

  # speckit.ship.run is provided by the `ship` extension, not by core Spec Kit.
  # Its command reads $ARGUMENTS before anything else ("You MUST consider the
  # user input before proceeding"), which is the designed lever for turning a
  # safe-by-default interactive command into an unattended one.
  - id: ship
    command: speckit.ship.run
    integration: "{{ inputs.integration }}"
    input:
      args: >-
        Target branch: {{ inputs.target_branch }}.

        FEATURE IDENTITY — resolve it from the run context, not from the repo. This is the
        step that drifted: read `.specify/run-context.json` ($SPECIFY_INIT_DIR first, then
        the current directory, then the primary checkout) and take `branch`, `feature_dir`
        and `worktree_path` from it. The branch to push is `branch`; the tasks, reviews,
        QA reports and screenshots to read are under `feature_dir`; the tree to commit
        from is `worktree_path`. Export SPECIFY_INIT_DIR and SPECIFY_FEATURE_DIRECTORY
        from those values for every `.specify/scripts/**` invocation.

        Never infer the feature from the current branch, from `.specify/feature.json`, or
        from the newest directory under `specs/`. This run's session is usually standing
        in the primary checkout, which after a merge is on the target branch and points at
        the feature that just shipped — opening a pull request for that one is exactly the
        failure this instruction exists to prevent. If anything resolves a feature the run
        context does not name, or no run context can be found, STOP: do not commit, do not
        push, do not open a pull request. Report what you found and what was pinned.

        WORKTREE DISCIPLINE — the two SPECIFY_* overrides are read only by
        `.specify/scripts/**`. Every other command this step runs — `git`, `gh`, the
        build, the test suite, any file write — resolves against the current working
        directory, and in an unattended run that is the PRIMARY checkout, not this run's
        tree. Direct each of them at the tree explicitly: `git -C <tree> …`, or `cd
        <tree>` first. A bare `git add`, `git commit`, `git push` or test command writes
        to whatever branch the primary happens to be standing on.

        <tree> is `worktree_path` from the run context when that field is non-empty, and
        `primary_path` when it is empty — an empty `worktree_path` means the run has no
        worktree (worktree_isolation=failed) and the primary IS this run's tree. Before
        the first write, confirm both: `git -C <tree> rev-parse --show-toplevel` names
        <tree>, and `git -C <tree> branch --show-current` names the run context's
        `branch`. If either disagrees, FAIL THIS STEP LOUDLY rather than write.

        ALL WRITES HAPPEN IN THIS RUN'S WORKTREE ON THIS RUN'S BRANCH. Finding yourself
        about to write in the primary checkout — a commit onto the target branch, an edit
        under `primary_path`, a branch cut from the primary's HEAD — is a FAILED STEP,
        not a workaround. Stop and report it; do not commit there anyway, and do not move
        the primary to make it fit.

        SHIP FROM THE RUN'S TREE — push with `git -C <tree> push`, read state with
        `git -C <tree> status|log|diff`, and pass `--head <branch>` and
        `--base {{ inputs.target_branch }}` to `gh pr create` explicitly, so the pull
        request cannot be inferred from whatever branch the primary is standing on. If
        the head the pull request would open from is not the run context's `branch`,
        STOP and report it. NEVER cut a new branch at the primary's tip to avoid a
        base==head pull request: that moves the user's checkout under them and carries
        unrelated commits from the primary into the pull request as if they were the
        feature.

        UNATTENDED RUN — no user is present and no prompt can be answered.
        Treat every confirmation this command would normally ask as answered
        YES and continue without waiting: the readiness summary, the
        rebase/merge confirmation, the push confirmation, the CHANGELOG
        prepend confirmation, and the pull request creation confirmation.

        Before the working-tree pre-flight check, commit every uncommitted
        change with a descriptive conventional-commit message instead of
        prompting to commit or stash.

        ARTIFACT VISIBILITY — the artifacts this step writes under `feature_dir` are
        evidence the pull request links to, so they have to be TRACKED, not force-added.
        Before committing, ask git whether they are: `git -C <tree> check-ignore -v --
        <feature_dir>/` and the same for each subdirectory this step wrote under it. The
        path need not exist yet — `check-ignore` matches pathnames, not files — and exit
        status 1 with no output means NOT ignored, which is the good case, not a failure.
        If nothing is reported, there is nothing to do.

        If a rule IS reported, do NOT reach for `git add -f`. That stages the files once
        and leaves the next step, the next run and the reviewer's checkout with the same
        conflict — and a pull request that links a path git still considers ignored is a
        404 waiting to happen. Un-ignore the path once, in a committed file: append
        `!<subdir>/` to `<feature_dir>/.gitignore`, creating that file if it does not
        exist. A `.gitignore` inside the feature directory outranks the root one, so a
        single line fixes the path for this step and every step after it, and a plain
        `git -C <tree> add` works from then on. If `feature_dir` ITSELF is reported as
        ignored its own `.gitignore` is never read — append the negation for it to the
        repo-root `.gitignore` first. Do nothing when the negation is already present,
        and never `git add -f` in this workflow.

        WORKTREE ISOLATION — the worktree step reported three fields; carry all
        of them through. If the run reported worktree_isolation=failed, say so plainly
        near the TOP of the pull request description: the run executed in the
        primary checkout rather than an isolated worktree, and name the branch.
        If it reported worktree_isolation=recovered, note that the primary
        checkout was moved off the feature branch to the base ref so the
        worktree could be attached — the user will want to know their working
        directory changed under them. If it reported session=primary for any
        reason other than enter_worktree being false, note that too: the branch
        is in its worktree but the agent session ran from the primary checkout,
        so every write depended on SPECIFY_INIT_DIR holding for
        `.specify/scripts/**` AND on each step pointing its own git, gh, build
        and test commands at the worktree, rather than on the working
        directory being right. And if it reported
        run_context=collision, put that near the TOP as well: a second unattended
        run owns the run context pointer in the primary checkout, so both runs'
        later steps were one unexported environment variable away from building
        somebody else's feature. Otherwise no mention is needed.

        Also carry forward anything the worktree step reported under Outline
        step 6 — a base ref behind its local counterpart, or feature inputs that
        are gitignored and therefore absent from the worktree. Both change how
        this pull request should be read: the first means the branch may not
        contain commits the reviewer has locally, the second means the feature
        was built against files no reviewer can see.

        If any tasks in tasks.md are still incomplete, do not stop — proceed
        and list the incomplete tasks in the pull request description.

        Prefer rebase over merge when synchronizing with the target branch.

        Do not block on CI. If gh is unavailable, if no CI run exists yet for
        the branch, or if a run is still in progress, proceed and record the
        CI status in the pull request description rather than waiting. If CI
        has already failed, still open the pull request and call the failure
        out prominently in the description.

        The one legitimate stop is a rebase conflict that cannot be resolved
        trivially: leave the branch as it is for manual resolution and report
        what happened. Never force-push.

        SCREENSHOTS SECTION — after pushing the branch and before creating the
        pull request, check FEATURE_DIR/screenshots/. If it contains images,
        add a "## Screenshots" section to the PR description: one markdown
        table per captured target with Before and After columns, one row per
        viewport.

        Read repository visibility with
        `gh repo view --json visibility,nameWithOwner`. When the repository is
        PRIVATE, raw.githubusercontent.com URLs do NOT render for reviewers —
        embed each image as
        https://github.com/{owner}/{repo}/blob/{head_sha}/{path}?raw=true.
        When it is PUBLIC, either form renders; prefer
        https://raw.githubusercontent.com/{owner}/{repo}/{head_sha}/{path}.
        If gh cannot report visibility, assume PRIVATE and use the blob form —
        it renders in both cases.

        Always pin the pushed head commit SHA, never the branch name, which
        dies when the branch is deleted after merge. If a side is missing (no
        baseline, or the after pass recorded a failure in the manifest notes),
        say so in that table cell and surface any manifest failure notes
        prominently at the top of the section. If screenshots/SKIPPED.md exists
        instead, add the single line "No UI changes — screenshots skipped."
        Verify with `git -C <tree> ls-tree -r <head_sha> --
        <feature_dir>/screenshots/` that every image you are about to link is
        actually in the pushed head — an image that is still ignored was never
        committed, and every URL in the table would 404. If any is missing,
        apply the ARTIFACT VISIBILITY rule above, commit and push again, and
        re-check before writing the section.

        RUN ID STAMP — end the pull request description with the HTML comment
        `<!-- speckit-run-id: <run_id> -->`, taking run_id from run-context.json. It
        renders as nothing and it is what makes the next check possible.

        Before rewriting the body of a pull request that ALREADY EXISTS for this branch,
        read the current body first. If it carries a `speckit-run-id` marker that is not
        yours and sorts LATER than yours — run ids begin with a UTC timestamp, so a plain
        string comparison is a time comparison — a newer run has already described this
        branch: do NOT overwrite it. Leave the body alone, post your summary as a pull
        request COMMENT instead, and say in the run summary that a newer run owns the
        description. An older marker, no marker, or your own is yours to rewrite. The lock
        should have made this impossible; this is the backstop for when it did not, and
        losing a description is not worth the tidiness.

        RELEASE THE LOCK — as the FINAL action of this step, once the pull request is open
        (or once this step has stopped for any reason, including a rebase conflict), run
        `bash <primary_path>/.specify/extensions/worktrees/scripts/bash/release-lock.sh
        --run-id "<run_id from run-context.json>"`, taking `primary_path` from the run
        context. The lock lives in the primary checkout and the script resolves it from
        either tree, but the primary is where the script itself is certain to be — a
        relative path resolves against wherever this step last stood. It removes the lock
        only while it still belongs to that run id, so it can never free somebody else's. The lock expires by itself after
        lock_ttl_minutes, so skipping this corrupts nothing — it just blocks the next run
        against this checkout for up to that long. Report the RELEASE_STATUS.
