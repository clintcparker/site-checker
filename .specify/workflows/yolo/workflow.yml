        repo-root `.gitignore` first. Do nothing when the negation is already present,
        and never `git add -f` in this workflow.

        ARTIFACT COMMIT — after the implementation is complete, commit all changes to the
        feature branch. Run `git -C <tree> add .` and
        `git -C <tree> commit` with a descriptive Conventional Commit message
        appropriate to what was implemented (e.g. `feat: implement <feature-name>`; use
        finer-grained commits per logical unit when the changes span multiple concerns).
        Skip silently if there is nothing to commit. Do not prompt — treat the optional git
        auto-commit hook as answered YES.

        UNATTENDED RUN — no user is present; never pause for input and never ask a question.
        Make every judgment call yourself, record it and its reasoning in the artifact, and
        flag it as an open decision in the run summary.

        RELEASE THE LOCK — this is the last step of the workflow, so it is the one that
        frees the run lock the worktree step took. As the FINAL action of this step, after
        everything above is done and even if some of it failed, run
        `bash <primary_path>/.specify/extensions/worktrees/scripts/bash/release-lock.sh
        --run-id "<run_id from run-context.json>"`, taking `primary_path` from the run
        context. The lock lives in the primary checkout and the script resolves it from
        either tree, but the primary is where the script itself is certain to be — a
        relative path resolves against wherever this step last stood. It removes the lock
        only while it still belongs to that run id, so it can never free somebody else's. Skipping it corrupts nothing — the
        lock expires on its own after lock_ttl_minutes — but it blocks the next run against
        this checkout for up to that long. Report the RELEASE_STATUS in the run summary.
