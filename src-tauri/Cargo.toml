[package]
name = "site-checker"
# Inert sentinel. The real version is written here by .github/workflows/release.yml
# from the pushed tag (v1.2.3 -> 1.2.3) at build time, and tauri.conf.json has no
# "version" key so this is what the bundle reports. Hand-editing it fails CI.
version = "0.0.0"
description = "A small macOS dashboard that checks whether your sites are up"
authors = ["Clint Parker <me@clintparker.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "site_checker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2.5"
uuid = { version = "1.24", features = ["v4"] }
reqwest = { version = "0.13", default-features = false, features = ["default-tls", "http2", "system-proxy", "charset"] }
tokio = { version = "1", features = ["time", "rt", "macros"] }
rand = "0.10"
# Used directly rather than through tauri-plugin-autostart, which records
# `current_exe()` and offers no way to record anything else. The plugin was a
# thin wrapper over this same crate, so the dependency count is unchanged.
auto-launch = "0.5"

[dev-dependencies]
tempfile = "3"
httpmock = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

